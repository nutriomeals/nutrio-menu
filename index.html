<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrio Meals | المينيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#173327;--o:#6e7a25;--l:#949b50;--c:#f6f3e9;--w:#fff;--ink:#173327;--mut:#5b6b5f;--r:20px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--c);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--g);box-shadow:0 2px 14px #0004}
.logo{height:38px;animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.lang{display:flex;background:#ffffff18;border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--c);font:700 13px Cairo,sans-serif;padding:6px 14px;border-radius:99px;cursor:pointer;transition:.3s}
.lang button.on{background:var(--l);color:var(--g)}
.hero{position:relative;overflow:hidden;background:var(--g);color:var(--c);padding:44px 20px 70px;text-align:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 14s ease-in-out infinite}
.b1{width:280px;height:280px;background:var(--o);top:-90px;inset-inline-start:-80px}
.b2{width:240px;height:240px;background:var(--l);bottom:-100px;inset-inline-end:-60px;animation-delay:-6s}
.hero>*:not(.blob){position:relative}
.hero h1{font-size:clamp(28px,7vw,48px);font-weight:800;line-height:1.3;animation:up .9s .15s both}
.hero p{margin:12px auto 0;max-width:520px;color:#f6f3e9cc;font-size:15px;line-height:1.8;animation:up .9s .3s both}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:-40px auto 0;padding:0 16px;position:relative;z-index:2}
.plan{background:var(--w);border-radius:var(--r);padding:20px 12px;text-align:center;box-shadow:0 12px 30px #17332722;animation:up .9s both;transition:transform .35s}
.plan:nth-child(1){animation-delay:.45s}.plan:nth-child(2){animation-delay:.6s}
.plan:active,.plan:hover{transform:translateY(-6px)}
.plan.hot{background:var(--o);color:var(--c)}
.plan small{display:block;font-weight:600;font-size:14px;opacity:.85}
.plan b{display:block;font-size:34px;font-weight:800;margin:4px 0 0;line-height:1.2}
.plan span{font-size:13px;font-weight:600;opacity:.8}
.sec{max-width:1000px;margin:0 auto;padding:46px 16px 10px}
.sec h2{font-size:24px;font-weight:800;text-align:center}
.hint{text-align:center;color:var(--mut);font-size:13.5px;margin:6px 0 18px}
.tabs{display:flex;gap:8px;justify-content:center;position:sticky;top:58px;z-index:10;padding:8px 0;background:linear-gradient(var(--c) 70%,#f6f3e900)}
.tabs button{border:2px solid var(--o);background:none;color:var(--o);font:700 15px Cairo,sans-serif;padding:8px 22px;border-radius:99px;cursor:pointer;transition:.3s}
.tabs button.on{background:var(--o);color:var(--c);transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--w);border-radius:var(--r);overflow:hidden;box-shadow:0 6px 20px #1733270f;opacity:0;transform:translateY(26px) scale(.97);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card.in{opacity:1;transform:none}
.card:hover{box-shadow:0 14px 32px #17332724;transform:translateY(-4px)}
.ph{aspect-ratio:1;overflow:hidden;background:#e9e3cf}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.card:hover .ph img,.card.in:active .ph img{transform:scale(1.1) rotate(1.5deg)}
.bd{padding:10px 12px 14px}
.bd h3{font-size:15px;font-weight:700;line-height:1.35;min-height:40px}
.kc{display:flex;align-items:baseline;gap:5px;color:var(--o);font-weight:800;font-size:19px;margin:2px 0 8px}
.kc small{font-size:11.5px;font-weight:600;color:var(--mut)}
.m{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:600}
.m i{height:6px;border-radius:9px;background:#e9e3cf;overflow:hidden;display:block}
.m i s{display:block;height:100%;width:0;border-radius:9px;background:var(--l);transition:width 1.1s .3s cubic-bezier(.2,.8,.2,1)}
.m:nth-child(2) i s{background:var(--o)}.m:nth-child(3) i s{background:var(--g)}
.card.in .m i s{width:var(--w)}
.m em{font-style:normal;color:var(--ink);min-width:36px;text-align:end;white-space:nowrap}
.na{font-size:12.5px;color:var(--mut);padding:6px 0}
.note{max-width:700px;margin:30px auto 0;padding:14px 18px;background:#6e7a2514;border-inline-start:4px solid var(--o);border-radius:12px;font-size:13px;line-height:1.8;color:var(--mut)}
footer{margin-top:44px;background:var(--g);color:#f6f3e9aa;text-align:center;padding:26px 16px;font-size:13px}
footer img{height:34px;margin-bottom:8px}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}.m i s{width:var(--w)}}
</style>
</head>
<body>
<header>
<img class="logo" id="logo" alt="Nutrio Meals">
<div class="lang"><button data-l="ar" class="on">عربي</button><button data-l="en">English</button></div>
</header>
<section class="hero">
<div class="blob b1"></div><div class="blob b2"></div>
<h1 data-t="h1"></h1>
<p data-t="sub"></p>
</section>
<div class="plans">
<div class="plan"><small data-t="cold"></small><b data-n="1799">0</b><span data-t="cur"></span></div>
<div class="plan hot"><small data-t="hot"></small><b data-n="1999">0</b><span data-t="cur"></span></div>
</div>
<main class="sec">
<h2 data-t="menu"></h2>
<p class="hint" data-t="pick"></p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<p class="note" id="note"></p>
</main>
<footer><img id="logo2" alt="Nutrio Meals"><div>© Nutrio Meals</div></footer>

let L='ar',tab='protein';

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function render(){
 const t=T[L];
 $('#grid').innerHTML=D[tab].map((d,i)=>{
  const nm=L==='ar'?d[1]:d[2];
  let body;
  if(d[3]){
   const mx=[45,50,17],lb=[t.p,t.c,t.f];
   body=`<div class="kc">${rg(d[3])}<small>${t.kcal}</small></div>`+[4,5,6].map((k,j)=>`<div class="m"><span>${lb[j]}</span><i><s style="--w:${Math.min(100,d[k][1]/mx[j]*100)}%"></s></i><em>${rg(d[k])} ${t.g}</em></div>`).join('');
  }else body=`<div class="na">${t.na}</div>`;
  return `<article class="card" style="transition-delay:${(i%4)*80}ms,${(i%4)*80}ms,0s"><div class="ph"><img src="${IMG[d[0]]}" alt="${nm}" loading="lazy"></div><div class="bd"><h3>${nm}</h3>${body}</div></article>`}).join('');
 document.querySelectorAll('.card').forEach(c=>io.observe(c));
 $('#note').textContent=t.note[tab];
 $('#tabs').innerHTML=['protein','carb','breakfast'].map(k=>`<button data-k="${k}" class="${k===tab?'on':''}">${t[k]}</button>`).join('');
}
function lang(l){
 L=l;const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('nutrio-lang',l)}catch(e){}
 render();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;render()}});
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(b)lang(b.dataset.l)});
document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function s(t){const p=Math.min(1,(t-t0-700)/1400);el.textContent=Math.round(n*(p<0?0:1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)});
let sl='ar';try{sl=localStorage.getItem('nutrio-lang')||'ar'}catch(e){}
